<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381F13"/>
      <stop offset="50%" stop-color="#59321E"/>
      <stop offset="100%" stop-color="#87553B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3C9"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.5"/>
  
  <!-- Stylized Hair Swirl & Crown Motif (GisAra Emblem) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Flowing Hair Strands -->
    <path d="M-90,60 C-60,-80 40,-130 95,-70 C140,-20 80,80 -20,95 C-80,105 -120,40 -90,60 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M-60,70 C-30,-40 50,-80 80,-30 C105,10 50,75 -10,80" 
          fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M-30,40 C0,-20 50,-40 60,-10 C70,20 30,50 0,55" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
    
    <!-- Central Styling Diamond / Sparkle -->
    <path d="M0,-85 L12,-60 L37,-60 L17,-44 L24,-20 L0,-34 L-24,-20 L-17,-44 L-37,-60 L-12,-60 Z" 
          fill="url(#goldGrad)"/>
    <circle cx="0" cy="15" r="8" fill="#F5E3C9"/>
  </g>
</svg>
